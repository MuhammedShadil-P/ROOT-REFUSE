          this.setState({ hasError: false, error: null });
          if (this.props.onReset) {
            this.props.onReset();
          }

                    </p>
                    {this.state.error?.message && (
                      <div className="p-3 bg-black/70 border border-white/10 rounded-xs">
                        <span className="text-[10px] text-lime font-bold uppercase block mb-1">EXCEPTION TRACE:</span>
                        <pre className="text-[11px] text-rose-300 overflow-x-auto whitespace-pre-wrap font-mono">
                          {this.state.error.message}
                        </pre>
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4 border-t border-white/10">
                    <button
                      onClick={this.handleReset}
                      className="flex items-center justify-center gap-2 py-3 px-4 bg-lime text-obsidian-950 font-bold text-xs uppercase tracking-wider hover:bg-lime/90 transition-all cursor-pointer shadow-brutal-sm active:translate-x-0.5 active:translate-y-0.5"
                    >
                      <IconSparkles className="w-3.5 h-3.5" />
                      <span>RE-INITIALIZE VIEW</span>
                    </button>
                    <button
                      onClick={this.handleReload}
                      className="flex items-center justify-center gap-2 py-3 px-4 bg-obsidian-800 text-white border border-white/20 font-bold text-xs uppercase tracking-wider hover:bg-obsidian-700 transition-all cursor-pointer"
                    >
                      <IconRecycle className="w-3.5 h-3.5" />
                      <span>RELOAD APPLICATION</span>
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          return this.props.children;
        }
      }

      // ==========================================
      // ROOT APP COMPONENT
      // ==========================================
      function App() {
        const [currentPage, setCurrentPage] = useState('home');
        const [theme, setTheme] = useState('light'); // 'dark' (Cyber Obsidian) | 'light' (Crisp Editorial)
        const [ecoCatchEnabled, setEcoCatchEnabled] = useState(true);
        const toggleEcoCatch = () => setEcoCatchEnabled(prev => !prev);
        const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');
        const [searchModalOpen, setSearchModalOpen] = useState(false);
        const [developerModalOpen, setDeveloperModalOpen] = useState(false);
        const [selectedItemForScanner, setSelectedItemForScanner] = useState(null);
        const [selectedTutorialModal, setSelectedTutorialModal] = useState(null);
        const [tutorials, setTutorials] = useState(INITIAL_TUTORIALS);
        const [upvotesMap, setUpvotesMap] = useState({});

        // Gamification User Profile State
        const [userProfile, setUserProfile] = useState({
          name: "Alex Sterling",
          handle: "@alex_reclaims",
          role: "Circular Materials Architect",
          avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80",
          credits: 840,
          itemsSorted: 142,
          wasteDivertedKg: 58.4,
          co2SavedKg: 192.6,
          blueprintsCreated: 3,
          upvotesReceived: 56,
          joinedDate: "FEB 2026",
          district: "Sector 07 // Urban Eco-Corridor"
        });

        const handleAddCredits = (points, actionType = 'action') => {
          setUserProfile(prev => {
            const oldCredits = prev.credits;
            const newCredits = oldCredits + points;

            // Check milestone unlocks
            const milestones = [250, 750, 1500];
            const unlocked = milestones.find(m => oldCredits < m && newCredits >= m);
            if (unlocked && window.confetti) {
              window.confetti({
                particleCount: 130,
                spread: 85,
                colors: ['#CCFF00', '#2563EB', '#0B0B0B']
              });
            }

            return {
              ...prev,
              credits: newCredits,
              itemsSorted: actionType === 'scan' || points === 50 ? prev.itemsSorted + 1 : prev.itemsSorted,
              blueprintsCreated: actionType === 'diy' || points === 150 ? prev.blueprintsCreated + 1 : prev.blueprintsCreated,
              wasteDivertedKg: Number((prev.wasteDivertedKg + (points * 0.05)).toFixed(1)),
              co2SavedKg: Number((prev.co2SavedKg + (points * 0.12)).toFixed(1))
            };
          });
        };

        const handleResetCredits = () => {
          setUserProfile(prev => ({ ...prev, credits: 200 }));
        };

        const navigateTo = (page, payload = null) => {
          if (page === 'credits') {
            setDeveloperModalOpen(true);
            return;
          }
          if (payload && page === 'scanner') {
            setSelectedItemForScanner(payload);
          }
          setCurrentPage(page);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const toggleUpvote = (id) => {
          setUpvotesMap(prev => {
            const isCurrentlyUpvoted = !!prev[id];
            const updated = { ...prev, [id]: !isCurrentlyUpvoted };
            setTutorials(curr => curr.map(t => t.id === id ? { ...t, upvotes: t.upvotes + (isCurrentlyUpvoted ? -1 : 1) } : t));
            return updated;
          });
        };

        return (
          <div className={`min-h-screen flex flex-col font-sans selection:bg-lime selection:text-obsidian-950 transition-colors duration-300 w-full max-w-full overflow-x-hidden ${
            theme === 'dark' ? 'cyber-dark-theme bg-obsidian-950 text-white' : 'bg-canvas text-obsidian-950'
          }`}>
            {/* Subtle Interactive Particle Canvas Background (Feature 1) */}
            <InteractiveParticleBackground theme={theme} />

            <CustomCursor />

            {/* Persistent Editorial Header with Gamification Avatar Shortcut & Theme Toggle */}
            <Navbar
              currentPage={currentPage}
              onNavigate={navigateTo}
              onOpenSearch={() => setSearchModalOpen(true)}
              userProfile={userProfile}
              onOpenCredits={() => setDeveloperModalOpen(true)}
              theme={theme}
              onToggleTheme={toggleTheme}
            />

            {/* Main Page Route Switcher */}
            <ErrorBoundary onReset={() => setCurrentPage("home")}>
              <main className="flex-1 w-full max-w-full overflow-x-hidden">
              {currentPage === 'home' && (
                <HomePage
                  onNavigate={navigateTo}
                  onOpenTutorial={(tut) => setSelectedTutorialModal(tut)}
                  upvotesMap={upvotesMap}
                  onToggleUpvote={toggleUpvote}
                  onOpenCredits={() => setDeveloperModalOpen(true)}
                />
              )}

              {currentPage === 'scanner' && (
                <ScannerPage
                  onNavigate={navigateTo}
                  initialSelectedItem={selectedItemForScanner}
                  onRewardPoints={(pts) => handleAddCredits(pts, 'scan')}
                />
              )}

              {currentPage === 'community' && (
                <CommunityPage
                  tutorials={tutorials}
                  setTutorials={setTutorials}
                  onOpenTutorial={(tut) => setSelectedTutorialModal(tut)}
                  upvotesMap={upvotesMap}
                  onToggleUpvote={toggleUpvote}
                  onRewardPoints={(pts) => handleAddCredits(pts, 'diy')}
                />
              )}

              {currentPage === 'map' && (
                <MapPage
                  onNavigate={navigateTo}
                  onRewardPoints={(pts) => handleAddCredits(pts, 'dropoff')}
                />
              )}

              {currentPage === 'profile' && (
                <ProfilePage
                  userProfile={userProfile}
                  onUpdateProfile={setUserProfile}
                  onAddCredits={handleAddCredits}
                  onResetCredits={handleResetCredits}
                  onNavigate={navigateTo}
                />
              )}
            </main>
            </ErrorBoundary>

            <Footer onNavigate={navigateTo} onOpenCredits={() => setDeveloperModalOpen(true)} ecoCatchEnabled={ecoCatchEnabled} onToggleEcoCatch={toggleEcoCatch} />

            <QuickSearchModal
              isOpen={searchModalOpen}
              onClose={() => setSearchModalOpen(false)}
              onSelectItem={(item) => {
                setSelectedItemForScanner(item);
                setCurrentPage('scanner');
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }}
            />

            <TutorialDetailModal
              tutorial={selectedTutorialModal}
              isOpen={!!selectedTutorialModal}
              onClose={() => setSelectedTutorialModal(null)}
              isUpvoted={selectedTutorialModal ? !!upvotesMap[selectedTutorialModal.id] : false}
              onToggleUpvote={toggleUpvote}
            />

            {/* Dedicated Creator & Developer Dossier Modal */}
            <DeveloperModal
              isOpen={developerModalOpen}
              onClose={() => setDeveloperModalOpen(false)}
            />

            {/* Interactive Non-Intrusive Eco-Catch Mini-Game */}
            <EcoCatch
              isEnabled={ecoCatchEnabled}
              onToggle={toggleEcoCatch}
              onReward={(pts, item) => handleAddCredits(pts, 'eco-catch')}
            />
          </div>
        );
      }

      function ScannerPage({ onNavigate, initialSelectedItem, onRewardPoints }) {
        const [search, setSearch] = useState('');
        const [category, setCategory] = useState('all');
        const [activeItem, setActiveItem] = useState(initialSelectedItem || WASTE_ITEMS[0]);
        
        const [isScanning, setIsScanning] = useState(false);

        const [selectedBoxId, setSelectedBoxId] = useState(null);
        const fileInputRef = useRef(null);

        const categories = [
          { id: 'all', label: 'ALL MATERIALS' },
          { id: 'compost', label: 'COMPOSTABLE / ORGANIC' },
          { id: 'recyclable', label: 'DRY RECYCLABLE' },
          { id: 'hazardous', label: 'HAZARDOUS E-WASTE' },
          { id: 'special', label: 'SPECIAL / TEXTILE' },
        ];

        const filtered = WASTE_ITEMS.filter((item) => {
          const matchCat = category === 'all' || item.category === category;
          const matchSearch = item.name.toLowerCase().includes(search.toLowerCase()) || item.tags.some(t => t.includes(search.toLowerCase()));
          return matchCat && matchSearch;
        });

        const runAnalysis = (imageSrc, matchedItem) => {
          setPreviewImg(imageSrc);
          setIsScanning(true);
          setScanProgress(15);
          setScanStage('Initializing multi-spectrum neural tensor model...');
          setDetectedItem(null);

          const stages = [
            { p: 40, text: 'Detecting edge geometry & composite reflectivity...' },
            { p: 70, text: 'Analyzing organic grease contamination vs cellulose...' },
            { p: 90, text: 'Matching ISO-14001 Municipal Recovery Standards...' },
            { p: 100, text: 'Classification Complete [Confidence: 98.6%]' },
          ];

          let i = 0;
          const interval = setInterval(() => {
            if (i < stages.length) {
              setScanProgress(stages[i].p);
              setScanStage(stages[i].text);
              i++;
            } else {
              clearInterval(interval);
              setIsScanning(false);
              const result = matchedItem || WASTE_ITEMS[Math.floor(Math.random() * WASTE_ITEMS.length)];
              setDetectedItem(result);
              setActiveItem(result);
              if (onRewardPoints) onRewardPoints(50);
            }
          }, 450);
        };

        const handleSearchSubmit = (e) => {
          if (e) e.preventDefault();
          if (!search.trim()) return;
          const found = WASTE_ITEMS.find(item => 
            item.name.toLowerCase().includes(search.toLowerCase()) ||
            item.tags.some(t => t.toLowerCase().includes(search.toLowerCase())) ||
            item.materialBreakdown.toLowerCase().includes(search.toLowerCase())
          );
          if (found) {
            setActiveItem(found);
            runAnalysis(found.image, found);
          }
        };

          const file = e.target.files?.[0];
          if (file) {

      function BadgeProgressionWidget({ credits, onAddCredits, onResetCredits }) {
        const currentBadgeIdx = BADGES_DATA.reduce((acc, b, i) => credits >= b.requiredCredits ? i : acc, 0);
        const currentBadge = BADGES_DATA[currentBadgeIdx];
        const nextBadge = BADGES_DATA[currentBadgeIdx + 1];

        const progress = nextBadge
          ? Math.min(100, Math.max(0, ((credits - currentBadge.requiredCredits) / (nextBadge.requiredCredits - currentBadge.requiredCredits)) * 100))
          : 100;

        return (
          <div className="space-y-6">
            
            {/* Rank Status Box */}
            <div className="bg-obsidian-950 text-white p-6 sm:p-8 rounded-sm border-2 border-obsidian-950 shadow-brutal space-y-4">

                  <h3 className="font-editorial-condensed text-3xl sm:text-4xl font-black uppercase text-white mt-0.5 tracking-tight">
                    {currentBadge.name} <span className="text-lime">✦</span>
                  </h3>
                  <span className="font-mono text-xs text-white/60">STATUS: {currentBadge.tier}</span>
                </div>

                <div className="bg-obsidian-900 px-5 py-3 border border-white/10 rounded-xs font-mono text-right">
                  <span className="text-white/50 text-[10px] uppercase block font-bold">TOTAL SCORE</span>
                  <div className="font-editorial-condensed text-3xl font-black text-lime">
                    {credits.toLocaleString()} <span className="text-sm font-mono text-white">ECO-PTS</span>
                  </div>
                </div>
              </div>

              {nextBadge ? (
                <div className="space-y-2">
                  <div className="flex items-center justify-between font-mono text-xs">
                    <span className="text-white/70">NEXT TIER: <strong className="text-white">{nextBadge.name.toUpperCase()}</strong></span>
                    <span className="text-lime font-bold">{credits} / {nextBadge.requiredCredits} PTS ({progress.toFixed(0)}%)</span>
                  </div>
                  <div className="w-full bg-obsidian-800 h-3 rounded-full overflow-hidden border border-white/10 p-0.5">
                    <div className="bg-lime h-full rounded-full transition-all duration-500 shadow-glow-lime" style={{ width: `${progress}%` }}></div>
                  </div>
                  <div className="font-mono text-[11px] text-white/50 text-right">
                    {nextBadge.requiredCredits - credits} PTS REMAINING TO UNLOCK

                </div>
              ) : (
                <div className="p-3 bg-lime/20 border border-lime text-lime font-mono text-xs font-bold rounded-xs flex items-center gap-2">
                  <IconCheckCircle className="w-4 h-4" />
                  <span>MAXIMUM RANK REACHED: TERRA GUARDIAN ACTIVE!</span>
                </div>
              )}

              {/* Test Action Buttons */}
              <div className="pt-4 border-t border-white/10 flex flex-wrap items-center justify-between gap-3">
                <span className="font-mono text-[11px] text-white/60 uppercase font-bold">
                  LOG GREEN ACTION & UNLOCK BADGES:
                </span>
                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={() => onAddCredits(50, 'scan')}

                </div>
              </div>
            </div>

            {/* Badges Grid (Seedling Scout, Compost Cadet, Upcycle Wizard, Terra Guardian) */}

              {BADGES_DATA.map((badge, idx) => {

                        isUnlocked ? badge.color : 'bg-obsidian-900/10 text-obsidian-900/30 border border-obsidian-900/20'
                      }`}>
                        {idx === 0 ? '🌱' : idx === 1 ? '🍂' : idx === 2 ? '🧙' : '🌍'}

                      <h4 className={`font-editorial-condensed text-xl uppercase font-black tracking-tight ${isUnlocked ? 'text-obsidian-950' : 'text-obsidian-900/60'}`}>
                        {badge.name}
                      </h4>
                      <span className="font-mono text-[10px] text-obsidian-900/50">{badge.tier}</span>
                      <p className="font-sans text-xs text-obsidian-900/70 leading-relaxed">{badge.description}</p>
                    </div>

                    <div className="pt-3 border-t border-obsidian-900/10 font-mono text-[10px] text-center font-bold uppercase">

                  </div>

      // ==========================================
      // INTERACTIVE PARTICLE CANVAS BACKGROUND (Feature 1)
      // ==========================================
      function InteractiveParticleBackground({ theme = 'light' }) {
        const canvasRef = useRef(null);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          const ctx = canvas.getContext('2d');
          let animationFrameId;
          let width = (canvas.width = window.innerWidth);
          let height = (canvas.height = window.innerHeight);

          const handleResize = () => {
            if (!canvas) return;
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
          };

          window.addEventListener('resize', handleResize);

          const mouse = { x: null, y: null, radius: 130 };

          const handleMouseMove = (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
          };

          const handleMouseLeave = () => {
            mouse.x = null;
            mouse.y = null;
          };

          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseleave', handleMouseLeave);

          const particleCount = Math.min(50, Math.floor((width * height) / 22000));
          const particles = [];
          const isDark = theme === 'dark';
          const primaryColor = isDark ? '204, 255, 0' : '40, 60, 20';

          for (let i = 0; i < particleCount; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 0.45,
              vy: (Math.random() - 0.5) * 0.45,
              radius: Math.random() * 2 + 1.2,
              alpha: Math.random() * 0.35 + 0.15,
              pulse: Math.random() * Math.PI
            });
          }

          const render = () => {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
              const p = particles[i];
              p.x += p.vx;
              p.y += p.vy;
              p.pulse += 0.02;

              if (p.x < 0) p.x = width;
              if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height;
              if (p.y > height) p.y = 0;

              if (mouse.x !== null && mouse.y !== null) {
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const distance = Math.hypot(dx, dy);

                if (distance < mouse.radius) {
                  const force = (mouse.radius - distance) / mouse.radius;
                  p.x -= (dx / distance) * force * 1.5;
                  p.y -= (dy / distance) * force * 1.5;

                  const lineAlpha = (1 - distance / mouse.radius) * 0.35;
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(mouse.x, mouse.y);
                  ctx.strokeStyle = `rgba(204, 255, 0, ${lineAlpha})`;
                  ctx.lineWidth = 0.8;
                  ctx.stroke();
                }
              }

              const currentRadius = p.radius + Math.sin(p.pulse) * 0.4;
              ctx.beginPath();
              ctx.arc(p.x, p.y, Math.max(0.8, currentRadius), 0, Math.PI * 2);
              ctx.fillStyle = isDark
                ? `rgba(204, 255, 0, ${p.alpha})`
                : `rgba(11, 11, 11, ${p.alpha * 0.5})`;
              ctx.fill();

              for (let j = i + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                const maxDist = 95;

                if (dist < maxDist) {
                  const edgeAlpha = (1 - dist / maxDist) * (isDark ? 0.2 : 0.08);
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.strokeStyle = `rgba(${primaryColor}, ${edgeAlpha})`;
                  ctx.lineWidth = 0.6;
                  ctx.stroke();
                }
              }
            }

            animationFrameId = requestAnimationFrame(render);
          };

          render();

          return () => {
            window.removeEventListener('resize', handleResize);
            window.removeEventListener('mousemove', handleMouseMove);
            window.removeEventListener('mouseleave', handleMouseLeave);
            cancelAnimationFrame(animationFrameId);
          };
        }, [theme]);

        return (
          <canvas
            ref={canvasRef}
            className="fixed inset-0 pointer-events-none z-0 opacity-80"
          />
        );
      }

      // ==========================================
      // ECO-CATCH INTERACTIVE MINI-GAME COMPONENT
      // ==========================================
      const SCRAP_ITEMS = [
        { id: 'bottle', name: 'PET Water Bottle', icon: '🧴', category: 'Recyclable Plastic', color: '#2563EB', tag: 'PLASTIC #1' },
        { id: 'can', name: 'Aluminum Soda Can', icon: '🥫', category: 'Precious Metal', color: '#CCFF00', tag: 'CAN RECYCLE' },
        { id: 'peel', name: 'Organic Banana Peel', icon: '🍌', category: 'Bio-Compost', color: '#EAB308', tag: 'COMPOST' },
        { id: 'battery', name: 'Lithium Battery Cell', icon: '🔋', category: 'E-Waste Depo', color: '#EF4444', tag: 'HAZMAT E-WASTE' },
        { id: 'cup', name: 'Takeaway Coffee Cup', icon: '☕', category: 'Composite Fiber', color: '#8B5CF6', tag: 'FIBER RECYCLE' },
        { id: 'box', name: 'Cardboard Box Scrap', icon: '📦', category: 'Cellulose Cardboard', color: '#F97316', tag: 'CELLULOSE' },
      ];

      function EcoCatch({ onReward, isEnabled, onToggle }) {
        const [fallingItem, setFallingItem] = useState(null);
        const [toast, setToast] = useState(null);
        const [catchCount, setCatchCount] = useState(0);
        const [isHoveringBin, setIsHoveringBin] = useState(false);
        const [isDragging, setIsDragging] = useState(false);
        const [isSnapping, setIsSnapping] = useState(false);
        const [binCenter, setBinCenter] = useState({ x: 0, y: 0 });
        const [soundEnabled, setSoundEnabled] = useState(true);

        const binRef = useRef(null);
        const animFrameRef = useRef(null);
        const isDraggingRef = useRef(false);
        const isSnappingRef = useRef(false);
        const startPointerRef = useRef({ x: 0, y: 0, time: 0 });

        // Update bin coordinates
        const updateBinCenter = () => {
          if (binRef.current) {
            const rect = binRef.current.getBoundingClientRect();
            setBinCenter({
              x: rect.left + rect.width / 2,
              y: rect.top + rect.height / 2
            });
          }
        };

        useEffect(() => {
          updateBinCenter();
          window.addEventListener('resize', updateBinCenter);
          window.addEventListener('scroll', updateBinCenter, { passive: true });
          return () => {
            window.removeEventListener('resize', updateBinCenter);
            window.removeEventListener('scroll', updateBinCenter);
            document.body.style.overflow = '';
            document.body.style.touchAction = '';
          };
        }, []);

        // Web Audio synthetic cyber chime
        const playEcoChime = () => {
          if (!soundEnabled) return;
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';

            const now = ctx.currentTime;
            osc.frequency.setValueAtTime(587.33, now); // D5
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.1); // A5
            osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.22); // D6

            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.36);
          } catch (e) {}
        };

        const recycleItem = (item, clickX, clickY) => {
          try {
            if (window.confetti) {
              const originX = clickX ? clickX / window.innerWidth : 0.88;
              const originY = clickY ? clickY / window.innerHeight : 0.88;
              window.confetti({
                particleCount: 45,
                spread: 70,
                origin: { x: originX, y: originY },
                colors: ['#CCFF00', '#2563EB', '#0B0B0B', '#10B981'],
                disableForReducedMotion: true
              });
            }
          } catch (e) {}

          playEcoChime();

          if (onReward) {
            onReward(10, item);
          }

          setCatchCount(prev => prev + 1);

          setToast({
            title: '+10 ECO-CREDITS',
            desc: `${item.name.toUpperCase()} DIVERTED!`,
            category: item.category,
            icon: item.icon
          });

          setFallingItem(null);
          setIsDragging(false);
          setIsSnapping(false);
          setIsHoveringBin(false);
          isDraggingRef.current = false;
          isSnappingRef.current = false;
          document.body.style.overflow = '';
          document.body.style.touchAction = '';
        };

        // Gentle Spawning Timer (Initial spawn 10s, then every 28-40s)
        useEffect(() => {
          if (!isEnabled) {
            setFallingItem(null);
            return;
          }

          let timeoutId;
          const scheduleNextSpawn = (delay) => {
            timeoutId = setTimeout(() => {
              const randomItem = SCRAP_ITEMS[Math.floor(Math.random() * SCRAP_ITEMS.length)];
              const minX = Math.max(35, window.innerWidth * 0.12);
              const maxX = Math.min(window.innerWidth - 65, window.innerWidth * 0.88);
              const startX = Math.random() * (maxX - minX) + minX;

              setFallingItem({
                item: randomItem,
                x: startX,
                y: -60,
                startX: startX,
                createdAt: Date.now(),
                id: `scrap-${Date.now()}`
              });

              const nextDelay = Math.floor(Math.random() * 12000) + 28000;
              scheduleNextSpawn(nextDelay);
            }, delay);
          };

          scheduleNextSpawn(10000);
          return () => clearTimeout(timeoutId);
        }, [isEnabled]);

        // Smooth physics floating animation
        useEffect(() => {
          if (!fallingItem || !isEnabled) return;

          let startTime = Date.now();
          const speed = 44; // pixels per second (~16-18s)

          const animate = () => {
            if (isDraggingRef.current || isSnappingRef.current) {
              animFrameRef.current = requestAnimationFrame(animate);
              return;
            }

            const elapsed = (Date.now() - startTime) / 1000;
            const newY = -60 + elapsed * speed;
            const sway = Math.sin(elapsed * 2.5) * 20;
            const newX = fallingItem.startX + sway;

            if (newY > window.innerHeight + 80) {
              setFallingItem(null);
            } else {
              setFallingItem(prev => (prev ? { ...prev, x: newX, y: newY } : null));
              animFrameRef.current = requestAnimationFrame(animate);
            }
          };

          animFrameRef.current = requestAnimationFrame(animate);

          return () => {
            if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
          };
        }, [fallingItem?.id, isEnabled]);

        // Magnetic snap helper
        const triggerSnapToBin = (item) => {
          if (!binRef.current) return;
          const rect = binRef.current.getBoundingClientRect();
          const targetX = rect.left + rect.width / 2;
          const targetY = rect.top + rect.height / 2;

          isSnappingRef.current = true;
          setIsSnapping(true);
          setIsHoveringBin(true);

          setFallingItem(prev => (prev ? { ...prev, x: targetX, y: targetY } : null));

          setTimeout(() => {
            recycleItem(item, targetX, targetY);
          }, 220);
        };

        // Extract coordinates from pointer or touch event
        const getEventCoords = (e) => {
          if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
          if (e.changedTouches && e.changedTouches.length > 0) {
            return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
          }
          return { x: e.clientX, y: e.clientY };
        };

        // Drag-and-drop pointer / touch handlers with body scroll lock
        const handlePointerDown = (e) => {
          e.stopPropagation();
          if (e.cancelable) e.preventDefault();

          // Lock page background scrolling on mobile while dragging trash
          document.body.style.overflow = 'hidden';
          document.body.style.touchAction = 'none';

          isDraggingRef.current = true;
          setIsDragging(true);

          const { x, y } = getEventCoords(e);
          startPointerRef.current = { x, y, time: Date.now() };
          updateBinCenter();

          const handlePointerMove = (moveEvent) => {
            if (!isDraggingRef.current || isSnappingRef.current) return;
            if (moveEvent.cancelable) moveEvent.preventDefault();

            const coords = getEventCoords(moveEvent);

            if (binRef.current) {
              const binRect = binRef.current.getBoundingClientRect();
              const bCenterX = binRect.left + binRect.width / 2;
              const bCenterY = binRect.top + binRect.height / 2;
              const dist = Math.hypot(coords.x - bCenterX, coords.y - bCenterY);

              setIsHoveringBin(dist < 115);

              if (dist < 48 && fallingItem) {
                cleanup();
                triggerSnapToBin(fallingItem.item);
                return;
              }
            }

            setFallingItem(prev => (prev ? { ...prev, x: coords.x, y: coords.y } : null));
          };

          const handlePointerUp = (upEvent) => {
            cleanup();

            if (isSnappingRef.current) return;

            const coords = getEventCoords(upEvent);
            const deltaX = Math.abs(coords.x - startPointerRef.current.x);
            const deltaY = Math.abs(coords.y - startPointerRef.current.y);
            const elapsed = Date.now() - startPointerRef.current.time;

            const wasTap = (deltaX < 14 && deltaY < 14) || elapsed < 220;

            if (wasTap) {
              if (fallingItem) {
                recycleItem(fallingItem.item, coords.x, coords.y);
              }
            } else if (binRef.current) {
              const binRect = binRef.current.getBoundingClientRect();
              const bCenterX = binRect.left + binRect.width / 2;
              const bCenterY = binRect.top + binRect.height / 2;
              const dist = Math.hypot(coords.x - bCenterX, coords.y - bCenterY);

              if (dist < 125 && fallingItem) {
                triggerSnapToBin(fallingItem.item);
              } else {
                setIsDragging(false);
                isDraggingRef.current = false;
                setIsHoveringBin(false);
              }
            } else {
              setIsDragging(false);
              isDraggingRef.current = false;
              setIsHoveringBin(false);
            }
          };

          const handlePointerCancel = () => {
            cleanup();
            setIsDragging(false);
            isDraggingRef.current = false;
            setIsHoveringBin(false);
          };

          const cleanup = () => {
            window.removeEventListener('pointermove', handlePointerMove);
            window.removeEventListener('pointerup', handlePointerUp);
            window.removeEventListener('pointercancel', handlePointerCancel);
            window.removeEventListener('touchmove', handlePointerMove);
            window.removeEventListener('touchend', handlePointerUp);
            window.removeEventListener('touchcancel', handlePointerCancel);
            document.body.style.overflow = '';
            document.body.style.touchAction = '';
          };

          window.addEventListener('pointermove', handlePointerMove, { passive: false });
          window.addEventListener('pointerup', handlePointerUp);
          window.addEventListener('pointercancel', handlePointerCancel);
          window.addEventListener('touchmove', handlePointerMove, { passive: false });
          window.addEventListener('touchend', handlePointerUp);
          window.addEventListener('touchcancel', handlePointerCancel);
        };

        // Toast auto-dismiss
        useEffect(() => {
          if (!toast) return;
          const timer = setTimeout(() => setToast(null), 3800);
          return () => clearTimeout(timer);
        }, [toast]);

        if (!isEnabled) return null;

        return (
          <React.Fragment>
            {/* 1. Drag Directional Guide Line (SVG overlay) */}
            {isDragging && fallingItem && binCenter.x > 0 && (
              <svg className="fixed inset-0 pointer-events-none z-45 w-full h-full">
                <defs>
                  <linearGradient id="ecoGuideGradHtml" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#CCFF00" stopOpacity="0.85" />
                    <stop offset="100%" stopColor="#10B981" stopOpacity="0.95" />
                  </linearGradient>
                  <filter id="glowLineHtml">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                      <feMergeNode in="coloredBlur"/>
                      <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                  </filter>
                </defs>

                <line
                  x1={fallingItem.x}
                  y1={fallingItem.y}
                  x2={binCenter.x}
                  y2={binCenter.y}
                  stroke="url(#ecoGuideGradHtml)"
                  strokeWidth="3"
                  strokeDasharray="8 8"
                  className="animate-dash-flow"
                  strokeLinecap="round"
                  filter="url(#glowLineHtml)"
                />

                <circle
                  cx={binCenter.x}
                  cy={binCenter.y}
                  r="42"
                  fill="none"
                  stroke="#CCFF00"
                  strokeWidth="2.5"
                  strokeDasharray="6 6"
                  className="animate-spin"
                  style={{ animationDuration: '4s' }}
                  opacity="0.85"
                />
                <circle
                  cx={binCenter.x}
                  cy={binCenter.y}
                  r="24"
                  fill="#CCFF00"
                  fillOpacity="0.15"
                  stroke="#CCFF00"
                  strokeWidth="1.5"
                />
              </svg>
            )}

            {/* 2. Falling Digital Scrap */}
            {fallingItem && (
              <div
                className={`fixed z-50 select-none cursor-grab active:cursor-grabbing transform -translate-x-1/2 -translate-y-1/2 touch-none ${
                  isSnapping
                    ? 'scale-0 rotate-180 opacity-20 duration-200 transition-all ease-in'
                    : 'animate-fadeIn'
                }`}
                style={{
                  left: `${fallingItem.x}px`,
                  top: `${fallingItem.y}px`,
                  transition: isDraggingRef.current && !isSnapping ? 'none' : isSnapping ? 'all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1)' : 'transform 0.05s linear',
                  touchAction: 'none'
                }}
                onPointerDown={handlePointerDown}
                onTouchStart={handlePointerDown}
                onClick={(e) => {
                  e.stopPropagation();
                  recycleItem(fallingItem.item, fallingItem.x, fallingItem.y);
                }}
                title="Click or drag to Smart Bin to recycle (+10 Eco-Credits)"
              >
                <div className="relative group flex items-center gap-1.5 sm:gap-2">
                  <div className={`relative p-2 sm:p-2.5 md:p-3 bg-obsidian-950/95 text-white border-2 rounded-full transition-all flex items-center justify-center ${
                    isHoveringBin
                      ? 'border-emerald-400 scale-120 shadow-[0_0_25px_#10B981]'
                      : isDragging
                      ? 'border-lime scale-110 shadow-glow-lime'
                      : 'border-lime shadow-glow-lime hover:scale-110 active:scale-95'
                  }`}>
                    <span className="text-xl sm:text-2xl md:text-3xl filter drop-shadow-md select-none">{fallingItem.item.icon}</span>
                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 sm:w-3.5 sm:h-3.5 bg-lime rounded-full animate-ping"></span>
                  </div>

                  {isDragging ? (
                    <div className="bg-lime text-obsidian-950 border-2 border-obsidian-950 px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-full font-mono text-[9px] sm:text-[10px] uppercase font-black tracking-wider pointer-events-none shadow-brutal-sm flex items-center gap-1 sm:gap-1.5 animate-bounce whitespace-nowrap">
                      <span className="hidden sm:inline">DRAG TO BIN</span>
                      <span className="sm:hidden">DRAG ↘</span>
                      <svg className="w-3 h-3 sm:w-3.5 sm:h-3.5 stroke-[3]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round">
                        <line x1="7" y1="7" x2="17" y2="17" />
                        <polyline points="17 7 17 17 7 17" />
                      </svg>
                    </div>
                  ) : (
                    <div className="bg-obsidian-950/90 text-lime border border-lime/40 px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-xs font-mono text-[8px] sm:text-[9px] uppercase font-bold tracking-wider pointer-events-none shadow-brutal-sm hidden xs:flex sm:flex items-center gap-1 whitespace-nowrap">
                      <span>{fallingItem.item.tag}</span>
                      <span className="text-white ml-0.5 sm:ml-1 font-black">● +10</span>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 3. Docked Smart Recycle Bin Target (Responsive Mobile Drop Zone) */}
            <div
              ref={binRef}
              className={`fixed bottom-3 right-3 sm:bottom-6 sm:right-6 z-40 select-none transition-all duration-300 animate-bounce-subtle ${
                isHoveringBin
                  ? 'scale-110 -translate-y-1 sm:scale-120 sm:-translate-y-2'
                  : isDragging
                  ? 'scale-105 sm:scale-115 -translate-y-0.5 sm:-translate-y-1'
                  : fallingItem
                  ? 'scale-105'
                  : 'scale-100'
              }`}
            >
              {/* Floating Directional Banner: "DROP HERE!" on mobile, "DROP HERE TO RECYCLE!" on desktop */}
              <div
                className={`absolute -top-7 sm:-top-10 left-1/2 -translate-x-1/2 whitespace-nowrap px-2 sm:px-3.5 py-0.5 sm:py-1 rounded-full text-[8px] sm:text-[10px] font-mono font-black uppercase tracking-wider transition-all duration-200 shadow-brutal flex items-center gap-1 sm:gap-1.5 border-2 ${
                  isHoveringBin
                    ? 'bg-emerald-400 text-obsidian-950 border-obsidian-950 scale-105 sm:scale-110 animate-pulse shadow-[0_0_20px_#10B981]'
                    : isDragging
                    ? 'bg-lime text-obsidian-950 border-obsidian-950 scale-105 animate-bounce shadow-glow-lime'
                    : fallingItem
                    ? 'bg-obsidian-950 text-lime border-lime animate-pulse-glow'
                    : 'bg-obsidian-950 text-lime border-lime/80 shadow-glow-lime'
                }`}
              >
                <span className={`w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full ${isHoveringBin ? 'bg-obsidian-950 animate-ping' : 'bg-lime animate-ping'}`}></span>
                <span className="hidden sm:inline">{isHoveringBin ? 'RELEASE TO SNAP!' : 'DROP HERE TO RECYCLE!'}</span>
                <span className="sm:hidden">{isHoveringBin ? 'SNAP!' : 'DROP HERE!'}</span>
              </div>

              {/* Main Docked Bin Capsule */}
              <div
                className={`flex items-center gap-1.5 sm:gap-3 p-1.5 sm:px-3.5 sm:py-2.5 rounded-full border-2 transition-all shadow-brutal backdrop-blur-md ${
                  isHoveringBin
                    ? 'bg-lime text-obsidian-950 border-obsidian-950 ring-4 ring-lime/80 shadow-[0_0_45px_#CCFF00]'
                    : isDragging
                    ? 'bg-obsidian-950 text-white border-lime ring-4 ring-lime/40 shadow-[0_0_30px_rgba(204,255,0,0.6)] animate-pulse-glow'
                    : 'bg-obsidian-950 text-white border-lime animate-pulse-glow'
                }`}
              >
                {/* Recycle Icon Badge */}
                <div className={`w-7 h-7 sm:w-9 sm:h-9 rounded-full flex items-center justify-center border-2 transition-all shrink-0 ${
                  isHoveringBin
                    ? 'bg-obsidian-950 text-lime border-obsidian-950 scale-110'
                    : 'bg-lime text-obsidian-950 border-lime'
                }`}>
                  <IconRecycle
                    className={`w-3.5 h-3.5 sm:w-4 sm:h-4 stroke-[2.5] ${
                      isHoveringBin
                        ? 'animate-spin'
                        : isDragging || fallingItem
                        ? 'animate-spin'
                        : ''
                    }`}
                    style={{ animationDuration: isHoveringBin ? '1s' : '4s' }}
                  />
                </div>

                {/* Details Label (Hidden on small mobile screens to keep bin compact & non-intrusive) */}
                <div className="hidden sm:flex flex-col pr-1 text-left">
                  <span className="font-editorial-condensed text-xs font-black uppercase tracking-wider leading-none">
                    {isHoveringBin ? 'MAGNETIC DUMP' : 'SMART RECYCLE BIN'}
                  </span>
                  <span className={`font-mono text-[9px] font-bold mt-1 ${isHoveringBin ? 'text-obsidian-950' : 'text-lime'}`}>
                    {catchCount > 0 ? `★ ${catchCount} RECYCLED` : '+10 PTS ECO-CATCH'}
                  </span>
                </div>

                {/* Sound Mute Toggle */}
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    setSoundEnabled(!soundEnabled);
                  }}
                  className="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-obsidian-900 border border-white/20 hover:border-lime flex items-center justify-center text-white/70 hover:text-lime transition-colors shrink-0"
                  title={soundEnabled ? "Mute Eco-Catch Sound" : "Enable Eco-Catch Sound"}
                >
                  {soundEnabled ? <IconVolume2 className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-lime" /> : <IconVolumeX className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-white/40" />}
                </button>

                {onToggle && (
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      onToggle();
                    }}
                    className="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-obsidian-900 border border-white/20 hover:border-rose-500 hover:text-rose-400 flex items-center justify-center text-white/60 transition-colors shrink-0"
                    title="Turn Off Eco-Catch Game"
                  >
                    <IconX className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                  </button>
                )}
              </div>
            </div>

            {/* 4. Sleek Cyber-Green Toast Notification */}
            {toast && (
              <div className="fixed top-20 sm:top-24 right-3 sm:right-5 z-50 animate-bounce max-w-[calc(100vw-24px)] sm:max-w-sm select-none">
                <div className="bg-obsidian-950 text-white border-2 border-lime shadow-brutal-lime p-2.5 sm:p-3.5 rounded-sm flex items-center gap-2.5 sm:gap-3">
                  <div className="w-7 h-7 sm:w-9 sm:h-9 bg-lime text-obsidian-950 flex items-center justify-center rounded-xs text-base sm:text-xl shrink-0">
                    {toast.icon}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <span className="font-editorial-condensed font-black text-[11px] sm:text-xs text-lime uppercase tracking-wider">
                        {toast.title}
                      </span>
                      <span className="font-mono text-[8px] sm:text-[9px] text-white/50 uppercase">VERIFIED</span>
                    </div>
                    <p className="font-mono text-[10px] sm:text-[11px] text-white font-bold truncate mt-0.5">
                      {toast.desc}
                    </p>
                  </div>
                  <button
                    onClick={() => setToast(null)}
                    className="text-white/40 hover:text-white p-1 shrink-0"
                  >
                    <IconX className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                  </button>
                </div>
              </div>
            )}
          </React.Fragment>
        );
      }

      // ==========================================

      function CustomCursor() {

          const move = (e) => setPos({ x: e.clientX, y: e.clientY });
          window.addEventListener('mousemove', move);
          return () => window.removeEventListener('mousemove', move);
        }, []);

        return (
          <div
            className="hidden lg:block fixed w-3 h-3 bg-lime rounded-full pointer-events-none z-[9999] mix-blend-difference -translate-x-1/2 -translate-y-1/2"
            style={{ left: `${pos.x}px`, top: `${pos.y}px` }}
          />
        );
      }
